<!doctype html>
<html lang="en">
<head><script src="j1_kb.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d2f52">
<title>J1 Pro – Government Exams & Careers</title>
<style>
:root{--navy:#0d2f52;--navy2:#123b66;--teal:#0f8f7e;--mint:#7ee0c8;--ink:#1d2939;--mut:#5b6b82;--line:#e3e9f2;--bg:#f2f5fa;--card:#fff;--warn:#9a6700;--warnbg:#fff7e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 30px}
.hero{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:18px;padding:16px}
.hero h1{margin:0;font-size:20px}.hero p{margin:6px 0 0;color:#c9d6e6;font-size:13.5px}
.tools{display:grid;gap:10px;margin-top:12px}
.tool{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%;font:inherit;color:inherit;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.tool .ic{width:44px;height:44px;border-radius:12px;background:#e6f6f2;display:grid;place-items:center;font-size:22px;flex:none}
.tool b{display:block;font-size:15.5px;color:var(--navy)}.tool small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.tool .go{margin-left:auto;color:var(--teal);font-size:22px;font-weight:700}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.back{border:1px solid var(--line);background:#fff;border-radius:10px;height:38px;padding:0 12px;font:600 14px inherit;color:var(--navy)}
.bar h2{margin:0;font-size:17px;color:var(--navy);flex:1;min-width:0;overflow-wrap:anywhere}
.search{position:relative}.search input{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 42px 0 14px;font-size:15px;background:#fff}
.search button{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;border-radius:9px;background:#eef2f7;color:var(--mut);font-size:18px}
.flab{font-size:12px;font-weight:700;color:var(--mut);margin:10px 0 5px;text-transform:uppercase;letter-spacing:.03em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 13px inherit;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;padding:0 8px;color:var(--ink)}
.meta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px;color:var(--mut);font-size:13px}
.link{border:0;background:none;color:var(--teal);font:700 13px inherit;padding:4px 0}
.ex{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.ex h3{margin:0;font-size:15px;color:var(--navy);overflow-wrap:anywhere}.ex .org{color:var(--mut);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#eef2f7;color:#40506a}
.tag.t{background:#e6f6f2;color:var(--teal)}.tag.e{background:#fff1e6;color:#b05a00}
.ex .q{font-size:13px;margin-top:7px;color:var(--ink)}.ex .q span{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;border:0;border-radius:11px;padding:0 14px;font:700 14px inherit;background:var(--navy);color:#fff;margin-top:10px}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.teal{background:var(--teal)}
.btn[disabled]{opacity:.45}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns .btn{width:100%;margin-top:8px}
.empty{background:#fff;border:1px dashed #c9d3e1;border-radius:14px;padding:18px;text-align:center;color:var(--mut);margin-top:10px}
.dh{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:16px;padding:14px}
.dh h2{margin:0;font-size:18px;overflow-wrap:anywhere}.dh .org{color:#c9d6e6;font-size:13px;margin-top:3px}
.dh .tags .tag{background:rgba(255,255,255,.14);color:#fff}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.sec h3{margin:0 0 6px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.04em}
.sec p{margin:4px 0}.sec ul,.sec ol{margin:4px 0;padding-left:20px}.sec li{margin:3px 0;white-space:normal;overflow-wrap:break-word}
.kv{display:grid;grid-template-columns:42% 58%;gap:4px 10px;font-size:14px}.kv div:nth-child(odd){color:var(--mut)}
.subj{margin-top:8px}.subj b{color:var(--navy);display:block}
.status{display:inline-block;font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--warnbg);color:var(--warn)}
.lk{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}.lk:last-child{border:0}
.lk span{color:var(--mut);font-size:12.5px;text-align:right}
.lk button{height:36px;border-radius:9px;border:0;background:var(--teal);color:#fff;font:700 13px inherit;padding:0 12px;flex:none}
.prog{height:6px;background:#e3e9f2;border-radius:6px;overflow:hidden;margin:8px 0 12px}.prog i{display:block;height:100%;background:var(--teal)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.qcard .qt{font-size:16px;font-weight:600;color:var(--ink)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;margin-top:8px;font:inherit;color:inherit}
.opt i{flex:none;width:26px;height:26px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:var(--mut)}
.opt.on{border-color:var(--teal);background:#effaf7}.opt.on i{background:var(--teal);color:#fff}
.opt.ok{border-color:#1a7f4b;background:#ecfdf3}.opt.ok i{background:#1a7f4b;color:#fff}.opt.bad{border-color:#b42318;background:#fef3f2}.opt.bad i{background:#b42318;color:#fff}
.score{text-align:center}.score .big{font-size:40px;font-weight:800;color:var(--navy)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.sgrid div{background:#f4f7fb;border-radius:10px;padding:8px;text-align:center;font-size:12px;color:var(--mut)}.sgrid b{display:block;font-size:20px;color:var(--ink)}
.rv{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:14px}.rv .ex2{color:var(--mut);font-size:13px;margin-top:4px}
.warnline{color:#b42318;font-size:13px;font-weight:600;margin-top:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%}
.tag.d{background:#e8f0fe;color:#1a56b0}
.badge{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;margin-left:6px;background:#fff1e6;color:#b05a00;letter-spacing:.03em;vertical-align:middle;text-transform:none}
.badge.g{background:#eef2f7;color:#40506a}.badge.ok{background:#e6f6f2;color:#0b6b5c}.badge.cal{background:#eaf2ff;color:#1f4f99}.badge.no{background:#f2f4f7;color:#475467}.umb{background:#fff7e0;border:1px solid #f1dca0;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.small{font-size:12.5px;color:var(--mut);margin:6px 0}
.tmr{flex:none;font:700 13px inherit;color:var(--navy);background:#eef2f7;border-radius:9px;padding:6px 9px}.tmr.low{background:#fef3f2;color:#b42318}
.qmeta{font-size:11.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
.fb{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:14px}.fb.good{background:#ecfdf3;color:#1a7f4b}.fb.badf{background:#fef3f2;color:#b42318}
.opt[disabled]{opacity:1}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.pq{height:36px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 13px inherit;color:var(--mut)}.pq.done{background:var(--teal);color:#fff;border-color:var(--teal)}.pq.cur{outline:2px solid var(--navy)}
.mask{position:fixed;inset:0;background:rgba(13,47,82,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:#fff;border-radius:16px;padding:16px;max-width:420px;width:100%;max-height:85vh;overflow:auto}.mbox h3{margin:0 0 8px;color:var(--navy)}
.tool.hl{border-color:var(--teal);background:#effaf7}.tool.sm{padding:11px 14px;margin-top:6px}
.sgrid{grid-template-columns:repeat(3,1fr)}
</style>
</head>

<body>
<div class="wrap" id="app"></div>
<script src="gov_exams_data.js"></script>
<script src="j1_ls.js"></script>
<script src="j1_content.js"></script>
<script>
/* J1 Pro 2.3 – Government Exams & Careers v2: Exam Explorer, Exam Dates & Fees, Syllabus & Papers, Practice Tests.
   Offline bundled data (gov_exams_data.js). Each date block has a status label (OFFICIAL / OFFICIAL CALENDAR / REPORTED / EXPECTED – NOT OFFICIAL / NOT ANNOUNCED). */
(function(){
'use strict';
var D=window.J1_GOV||{exams:[],practice:{},cats:[],quals:[]}, APP=!!window.AppInventor, app=document.getElementById('app');
var EX=Array.isArray(D.exams)?D.exams.filter(function(e){return e&&e.id&&e.name}):[];
var P=D.practice||{}, QI={};
Object.keys(P).forEach(function(k){(P[k].q||[]).forEach(function(q){if(q&&q.id&&Array.isArray(q.o)&&q.o.length>1&&q.a>=0&&q.a<q.o.length){q.s=k;QI[q.id]=q}})});
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(v){if(v==null)return[];if(Array.isArray(v))return v.filter(function(x){return x!=null&&String(x).trim()!==''});var s=String(v).trim();return s?[s]:[]}
function ul(v){var a=arr(v);return a.length?'<ul>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':''}
function ol(v){var a=arr(v);return a.length?'<ol>'+a.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>':''}
function send(m){try{AppInventor.setWebViewString(m)}catch(e){}}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2400)}
function okUrl(u){return typeof u==='string'&&/^https:\/\/[^\s]+$/i.test(u)}
function openUrl(u){if(!okUrl(u)){toast('Link not available');return}if(APP){send('GOVURL§§'+u);toast('Opening the official website…')}else window.open(u,'_blank','noopener')}
function byId(id){for(var i=0;i<EX.length;i++)if(EX[i].id===id)return EX[i];return null}
function ls(k,v){try{if(v===undefined){var s=localStorage.getItem(k);return s?JSON.parse(s):null}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
var KEY='j1_gov_ui',F={q:'',qual:'',cat:'',state:''},sv=ls(KEY);if(sv)for(var k in F)if(typeof sv[k]==='string')F[k]=sv[k];
function saveF(){ls(KEY,F)}
var PROG=ls('j1_gov_prog')||{};if(!PROG.seen||typeof PROG.seen!=='object')PROG.seen={};if(!Array.isArray(PROG.hist))PROG.hist=[];
function saveProg(){var ks=Object.keys(PROG.seen);if(ks.length>4000){ks.slice(0,ks.length-4000).forEach(function(x){delete PROG.seen[x]})}ls('j1_gov_prog',PROG)}

/* ---------- navigation ---------- */
var stack=[{v:'home'}];
function go(v,o){var s={v:v};for(var k in o||{})s[k]=o[k];stack.push(s);render();window.scrollTo(0,0)}
function back(){if(top().v==='test'&&T&&!T.done){stopTimer();saveCur();toast('Test saved – continue it from Practice Tests')}
  if(stack.length>1){stack.pop();render();window.scrollTo(0,0)}else if(APP)send('GOVNAV§§close')}
window.J1GovSystemBack=back;
function top(){return stack[stack.length-1]}
function bar(t){return '<div class="bar"><button class="back" data-a="back">‹ Back</button><h2>'+esc(t)+'</h2></div>'}

/* ---------- search + filters ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/\s+/g,' ').trim()}
function hay(e){return norm([e.name,e.short,e.org,e.cat,e.state,e.type,e.career,e.minQual].concat(arr(e.posts),arr(e.quals)).join(' | '))}
function filtered(mode){var q=norm(F.q),words=q?q.split(' '):[];return EX.filter(function(e){
  if(mode==='dates'&&!e.dates)return false;
  if(F.qual&&arr(e.quals).indexOf(F.qual)<0)return false;
  if(F.cat&&e.cat!==F.cat)return false;
  if(F.state){if(F.state==='All India'&&e.state!=='All India')return false;if(F.state!=='All India'&&e.state!==F.state)return false}
  if(!words.length)return true;var h=' '+hay(e).replace(/[^a-z0-9]+/g,' ');return words.every(function(w){w=w.replace(/[^a-z0-9]+/g,' ').trim();return !w||h.indexOf(' '+w)>=0})})}
function cats(mode){return (D.cats||[]).filter(function(c){return EX.some(function(e){return e.cat===c&&(mode!=='dates'||e.dates)})})}
function quals(){return (D.quals||[]).filter(function(q){return EX.some(function(e){return arr(e.quals).indexOf(q)>=0})})}
function states(){var s=[];EX.forEach(function(e){if(e.state&&s.indexOf(e.state)<0)s.push(e.state)});s.sort(function(a,b){return a==='All India'?-1:b==='All India'?1:a==='Tamil Nadu'?-1:b==='Tamil Nadu'?1:a<b?-1:1});return s}
var ACT={det:'View details',dates:'Dates & fees',syl:'Syllabus & papers',prac:'Practice'};
function examCard(e,mode){
  var line=mode==='dates'&&e.dates?'<div class="q"><span>'+esc(e.dates.basis)+'</span></div>':'<div class="q"><span>Minimum qualification:</span> '+esc(e.minQual)+'</div>';
  return '<div class="ex"><h3>'+esc(e.name)+'</h3><div class="org">'+esc(e.org)+'</div><div class="tags"><span class="tag">'+esc(e.short||'')+'</span><span class="tag t">'+esc(e.cat)+'</span>'+(e.type!=='Recruitment exam'?'<span class="tag e">'+esc(e.type)+'</span>':'')+(e.state&&e.state!=='All India'?'<span class="tag">'+esc(e.state)+'</span>':'')+(e.dates&&mode!=='dates'?'<span class="tag d">Dates & fees</span>':'')+'</div>'+
  line+'<button class="btn" data-open="'+esc(e.id)+'" data-mode="'+esc(mode||'det')+'">'+ACT[mode||'det']+' ›</button></div>'}
function explore(mode,title){
  var list=filtered(mode),any=F.q||F.qual||F.cat||F.state,all=mode==='dates'?EX.filter(function(e){return e.dates}).length:EX.length;
  var h=bar(title)+'<div class="search"><input id="q" type="text" enterkeyhint="search" placeholder="Search exam, organisation, post or qualification" value="'+esc(F.q)+'" autocomplete="off"><button data-a="clearq" aria-label="Clear search">×</button></div>';
  if(mode!=='dates')h+='<div class="flab">Qualification</div><div class="chips">'+['All'].concat(quals()).map(function(q){var on=(q==='All'&&!F.qual)||q===F.qual;return '<button class="chip'+(on?' on':'')+'" data-qual="'+esc(q==='All'?'':q)+'">'+esc(q)+'</button>'}).join('')+'</div>';
  h+='<div class="row2"><div><div class="flab">Category</div><select id="fcat"><option value="">All categories</option>'+cats(mode).map(function(c){return '<option'+(c===F.cat?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></div>'+
     '<div><div class="flab">State</div><select id="fstate"><option value="">All states</option>'+states().map(function(s){return '<option'+(s===F.state?' selected':'')+'>'+esc(s)+'</option>'}).join('')+'</select></div></div>';
  h+='<div class="meta"><span id="cnt">'+list.length+' of '+all+' examinations</span>'+(any?'<button class="link" data-a="reset">Reset filters</button>':'')+'</div><div id="res">'+results(list,mode)+'</div>';
  if(mode==='dates')h+='<p class="small">Only examinations with a tentative calendar or a regular yearly pattern are listed here. For other exams, use the official website.</p>';
  return h}
function results(list,mode){return list.length?list.map(function(e){return examCard(e,mode)}).join(''):'<div class="empty">No examinations match your search. Try another keyword or clear the filters.</div>'}

/* ---------- exam details ---------- */
function bcls(l){l=String(l||'');return l==='OFFICIAL'?'badge ok':l==='OFFICIAL CALENDAR'?'badge cal':l==='NOT ANNOUNCED'||l==='VARIES BY NOTIFICATION'?'badge no':'badge'}
function umb(e){return e.umb?'<div class="umb">⚠ '+esc(e.umb)+'</div>':''}
function kv(rows){return '<div class="kv">'+rows.map(function(r){return '<div>'+esc(r[0])+'</div><div>'+esc(r[1])+'</div>'}).join('')+'</div>'}
function detail(e){
  var h=bar('Exam details')+'<div class="dh"><h2>'+esc(e.name)+'</h2><div class="org">'+esc(e.org)+'</div><div class="tags"><span class="tag">'+esc(e.short)+'</span><span class="tag">'+esc(e.cat)+'</span><span class="tag">'+esc(e.state)+'</span></div></div>'+umb(e);
  h+='<div class="btns"><button class="btn teal" data-open="'+esc(e.id)+'" data-mode="syl">📘 Syllabus</button><button class="btn sec" data-open="'+esc(e.id)+'" data-mode="prac">📝 Practice</button></div>';
  h+='<div class="sec"><h3>Overview</h3><p>'+esc(e.about)+'</p>'+(e.type!=='Recruitment exam'&&e.type!=='Recruitment (post-wise)'?'<p class="small">'+(e.type==='Apprenticeship'?'Apprenticeship is paid training – it does not guarantee a permanent job.':e.type==='Eligibility test'?'This is an eligibility test, not a job by itself.':'This is an entrance / qualifying examination, not a direct job recruitment.')+'</p>':'')+'</div>';
  h+='<div class="sec"><h3>Eligibility</h3>'+kv([['Qualification',e.minQual],['Age',e.age||'As per the notification']].concat(e.fy?[['Final-year students',e.fy]]:[]))+ul(e.elig)+'</div>';
  if(arr(e.posts).length)h+='<div class="sec"><h3>Posts and career</h3>'+ul(e.posts)+(e.duties?'<p><b>Nature of work:</b> '+esc(e.duties)+'</p>':'')+'</div>';
  if(arr(e.stages).length)h+='<div class="sec"><h3>Selection process</h3>'+ol(e.stages)+'</div>';
  if(e.dates||e.fee)h+='<div class="sec"><h3>Dates & fees</h3>'+(e.dates&&e.dates.rows.length?kv(e.dates.rows.slice(0,2)):'')+(e.fee?'<p class="small">Dates: '+esc(e.dates?e.dates.label:'')+' · Fee: '+esc(e.fee.year)+'.</p>':'')+'<button class="btn sec" data-open="'+esc(e.id)+'" data-mode="dates" style="width:100%">See dates & fees ›</button></div>';
  h+='<div class="sec"><h3>Official links</h3>'+links(e)+'</div>';
  return h+'<p class="small">'+esc(D.disclaimer||'')+'</p>'}
function lk(label,u){return okUrl(u)?'<div class="lk"><b>'+esc(label)+'</b><button data-url="'+esc(u)+'">Open ›</button></div>':''}
function links(e){var h=lk('Official website',e.web);
  if(okUrl(e.apply)&&e.apply!==e.web)h+=lk('Application portal',e.apply);else if(e.applyNote)h+='<p class="small">Application: '+esc(e.applyNote)+'</p>';
  if(okUrl(e.papers)&&e.papers!==e.web){h+=lk('Previous-year papers',e.papers);if(e.papersNote)h+='<p class="small">Previous papers: '+esc(e.papersNote)+'</p>'}else if(e.papersNote)h+='<p class="small">Previous papers: '+esc(e.papersNote)+'</p>';
  if(!h)h='<p>'+esc(e.note||'Use the conducting organisation\'s official website.')+'</p>';
  else if(e.note)h+='<p class="small">'+esc(e.note)+'</p>';
  return h}

/* ---------- dates & fees ---------- */
function datesView(e){var h=bar('Dates & fees')+'<div class="dh"><h2>'+esc(e.name)+'</h2><div class="org">'+esc(e.org)+'</div></div>'+umb(e);
  if(e.dates){var d=e.dates;
    h+='<div class="sec"><h3>Dates <span class="'+bcls(d.label)+'">'+esc(d.label)+'</span></h3><p class="small">Based on: '+esc(d.basis)+'</p>'+(d.rows.length?kv(d.rows):'<p>No regular yearly schedule – watch the official website.</p>');
    if(arr(d.hist).length)h+='<div class="flab" style="margin-top:10px">Previous years</div>'+ul(d.hist);
    h+='</div>'}

function pracPick(e){var s=subs(e),m=mockOf(e),h=bar('Practice')+'<div class="dh"><h2>'+esc(e.name)+'</h2><div class="org">'+poolOf(s).length+' questions in this exam\'s subjects</div></div>';

  else if(a==='all'){T.showAll=true;render()}
  else if(a==='restart'){var e=byId(T.exam),k=T.kind,s=T.subj;stack.pop();startTest(e,k,s)}
  else if(a==='toexam'){var id=T.exam;T=null;while(stack.length>1&&top().v!=='prac')stack.pop();if(top().v!=='prac')go('prac',{id:id});else render()}
}
/* ---------- 2.4: online corrections of exam information (j1_content.js) ---------- */
var NOTICE='',UPD='';
function okField(f,v){if(v===null)return f==='note'||f==='papers'||f==='apply';
  if(f==='dates')return typeof v==='object'&&typeof v.label==='string'&&Array.isArray(v.rows)&&v.rows.every(function(r){return Array.isArray(r)&&r.length===2});
  if(f==='fee')return typeof v==='object'&&typeof v.year==='string'&&Array.isArray(v.rows)&&v.rows.every(function(r){return Array.isArray(r)&&r.length===2});
  if(f==='mock')return typeof v==='object'&&Array.isArray(v.mix)&&v.mix.length>0&&v.min>0&&v.mark>0&&v.mix.every(function(x){return Array.isArray(x)&&Array.isArray(x[1])&&x[2]>0});
  if(f==='syllabus')return Array.isArray(v)&&v.length>0&&v.every(function(x){return x&&typeof x.s==='string'&&Array.isArray(x.t)});
  if(f==='posts'||f==='elig'||f==='stages'||f==='quals')return Array.isArray(v)&&v.length>0&&v.every(function(x){return typeof x==='string'});
  if(f==='web'||f==='apply'||f==='papers')return typeof v==='string'&&/^https:\/\/[^\s]+$/.test(v);
  return typeof v==='string'&&v.length>0}
function applyGov(p){var FL=['dates','fee','note','web','apply','posts','age','elig','stages','about','career','papers','syllabus','mock','minQual','quals','fy','umb','applyNote','papersNote','sylStatus'];
  Object.keys(p.exams&&typeof p.exams==='object'?p.exams:{}).forEach(function(id){var e=byId(id),src=p.exams[id];if(!e||!src)return;FL.forEach(function(f){if(Object.prototype.hasOwnProperty.call(src,f)&&okField(f,src[f]))e[f]=src[f]})});
  (Array.isArray(p.add)?p.add:[]).forEach(function(e){if(e&&e.id&&e.name&&e.org&&e.cat&&Array.isArray(e.quals)&&Array.isArray(e.practice)&&!byId(e.id)){D.exams.push(e);EX.push(e)}});
  Object.keys(p.questions&&typeof p.questions==='object'?p.questions:{}).forEach(function(k){if(!Array.isArray(p.questions[k]))return;if(!P[k])P[k]={name:k,q:[]};if(!Array.isArray(P[k].q))P[k].q=[];p.questions[k].forEach(function(q){if(q&&q.id&&typeof q.q==='string'&&!QI[q.id]&&Array.isArray(q.o)&&q.o.length>1&&q.a>=0&&q.a<q.o.length){q.s=k;P[k].q.push(q);QI[q.id]=q}})});
  if(typeof p.notice==='string')NOTICE=p.notice;UPD=p.updated||UPD}
if(window.J1Content)J1Content.load('gov',D.contentVer||0,applyGov,function(){if(top().v!=='test'){render();toast('Exam information updated')}});
window.__gov={D:D,F:F,filtered:filtered,stack:stack,act:act,startTest:startTest,finish:finish,applyGov:applyGov,QI:QI,byId:byId,get T(){return T}};
if(!EX.length){app.innerHTML='<div class="empty">The examination guide could not be loaded.</div>'}else render();
})();
</script>
